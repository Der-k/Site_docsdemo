<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - {{ app_name }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>body{font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif}</style>
</head>
<body class="grid min-h-screen place-items-center bg-slate-50 px-4 text-slate-800 antialiased">
  <main class="w-full max-w-sm rounded-lg border border-slate-200 bg-white p-6 shadow-sm">
    <div class="mb-4 flex items-center gap-2">
      <span class="grid h-8 w-8 place-items-center rounded-md bg-emerald-500 text-sm font-bold text-[#0f1b2d]">A</span>
      <span class="font-semibold text-slate-900">{{ app_name }}</span>
    </div>
    <p class="mb-4 text-sm text-slate-600">This is a private demo. Enter the demo password to continue.</p>
    {% if error %}<div role="alert" class="mb-3 rounded-md border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-800">{{ error }}</div>{% endif %}
    <form method="post" action="/login" class="space-y-3">
      <input type="hidden" name="next" value="{{ next }}">
      <label class="block text-xs font-medium text-slate-600">Password
        <input type="password" name="password" required autofocus autocomplete="current-password" class="mt-1 block w-full rounded-md border border-slate-300 px-3 py-2 text-sm focus:border-emerald-500 focus:outline-none focus:ring-1 focus:ring-emerald-500"></label>
      <button class="w-full rounded-md bg-emerald-600 px-3 py-2 text-sm font-medium text-white hover:bg-emerald-700">Sign in</button>
    </form>
  </main>
</body>
</html>
