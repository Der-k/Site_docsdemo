{% extends "base.html" %}
{% block content %}
<p class="-mt-3 mb-4 text-sm text-slate-500">{{ t.description }} Mark each item pass or fail. Failed items create findings and corrective actions automatically.</p>
<form method="post" action="/inspections" class="mx-auto max-w-4xl space-y-4">
  <input type="hidden" name="template_id" value="{{ t.id }}">
  <div class="grid gap-3 rounded-lg border border-slate-200 bg-white p-4 shadow-sm sm:grid-cols-2">
    <label class="text-xs font-medium text-slate-600">Site<select name="site_id" required class="mt-1 block w-full rounded-md border border-slate-300 px-2 py-1.5 text-sm">
      {% for s in sites %}<option value="{{ s.id }}" {{ 'selected' if s.id == site }}>{{ s.name }}</option>{% endfor %}</select></label>
    <label class="text-xs font-medium text-slate-600">Inspector<input name="inspector" value="{{ user.name }}" class="mt-1 block w-full rounded-md border border-slate-300 px-2 py-1.5 text-sm"></label>
  </div>
  <div class="divide-y divide-slate-100 rounded-lg border border-slate-200 bg-white shadow-sm">
    {% for it in t["items"] %}
    <fieldset class="grid gap-2 p-4 md:grid-cols-12 md:items-start">
      <legend class="sr-only">{{ it.text }}</legend>
      <div class="md:col-span-5"><div class="text-xs text-slate-500">{{ it.category }}</div><div class="text-sm font-medium text-slate-900">{{ loop.index }}. {{ it.text }}</div></div>
      <div class="flex gap-4 text-sm md:col-span-2">
        <label class="flex items-center gap-1.5 text-emerald-700"><input type="radio" name="r_{{ it.id }}" value="pass" required class="text-emerald-600"> Pass</label>
        <label class="flex items-center gap-1.5 text-red-700"><input type="radio" name="r_{{ it.id }}" value="fail" required class="text-red-600"> Fail</label>
      </div>
      <input name="n_{{ it.id }}" placeholder="Observation note (optional)" aria-label="Note for {{ it.text }}" class="rounded-md border border-slate-300 px-2 py-1.5 text-sm md:col-span-5">
    </fieldset>
    {% endfor %}
  </div>
  <label class="block rounded-lg border border-slate-200 bg-white p-4 text-xs font-medium text-slate-600 shadow-sm">General observations
    <textarea name="observations" rows="3" class="mt-1 block w-full rounded-md border border-slate-300 px-2 py-1.5 text-sm"></textarea></label>
  <button class="rounded-md bg-emerald-600 px-4 py-2 text-sm font-medium text-white hover:bg-emerald-700">Submit inspection</button>
</form>
{% endblock %}
