{% extends "base.html" %}
{% block content %}
<div class="rounded-lg border border-dashed border-slate-300 bg-white p-8 text-center">
  <p class="font-medium text-slate-800">{{ what }} could not be found.</p>
  <p class="mt-1 text-sm text-slate-500">It may have been removed when the demo data was reset.</p>
  <a href="{{ back_href }}" class="mt-4 inline-block rounded-md bg-emerald-600 px-3 py-1.5 text-sm font-medium text-white hover:bg-emerald-700">{{ back_label }}</a>
</div>
{% endblock %}
