# Render Blueprint: New > Blueprint > pick this repo. Free plan, single instance.
services:
  - type: web
    name: aaemi-sitelog-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SECRET_KEY
        generateValue: true
      - key: HTTPS_ONLY
        value: "1"
      - key: DEMO_PASSWORD   # Render asks for this when you create the service
        sync: false
      # GROQ_API_KEY is intentionally not listed: without it the public site uses the offline demo assistant.
      # Add it in the Render dashboard (Environment) only if you want the live AI on the public site.
